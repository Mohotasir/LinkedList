<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doubly Linked List — Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700&family=Hind+Siliguri:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7FA; --ink:#18212F; --muted:#586376; --line:#D8DEE8;
  --stage:#FBFBF8; --grid:#E3E9F1; --cell:#FFFFFF; --dcell:#E4ECFF;
  --next:#1F6FEB; --prev:#D6336C; --hot:#E67700;
  --head:#2B8A3E; --tail:#7048E8; --cur:#0C8599; --temp:#A5673F; --last:#C2410C;
  --codebg:#EEF1F6; --ontag:#FFFFFF;
  --c-com:#6B7788; --c-str:#B35900; --c-kw:#8250DF; --c-ty:#0969DA; --c-num:#B35900; --c-fn:#0A7E8C;
  --ui:'Hind Siliguri',system-ui,'Noto Sans Bengali',sans-serif;
  --disp:'Baloo Da 2','Hind Siliguri',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B111B; --ink:#E6ECF5; --muted:#9AA7BA; --line:#25324A;
    --stage:#0F1826; --grid:#18233A; --cell:#16233A; --dcell:#1E3159;
    --next:#6EA8FE; --prev:#FF7AA8; --hot:#FFB02E;
    --head:#5FD38D; --tail:#A78BFA; --cur:#4DD4E8; --temp:#E0A27A; --last:#FDBA74;
    --codebg:#121B2B; --ontag:#0B111B;
    --c-com:#7F8DA3; --c-str:#FFB86B; --c-kw:#C4A5FF; --c-ty:#7CC0FF; --c-num:#FFB86B; --c-fn:#5FD6C8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B111B; --ink:#E6ECF5; --muted:#9AA7BA; --line:#25324A;
  --stage:#0F1826; --grid:#18233A; --cell:#16233A; --dcell:#1E3159;
  --next:#6EA8FE; --prev:#FF7AA8; --hot:#FFB02E;
  --head:#5FD38D; --tail:#A78BFA; --cur:#4DD4E8; --temp:#E0A27A; --last:#FDBA74;
  --codebg:#121B2B; --ontag:#0B111B;
  --c-com:#7F8DA3; --c-str:#FFB86B; --c-kw:#C4A5FF; --c-ty:#7CC0FF; --c-num:#FFB86B; --c-fn:#5FD6C8;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.75 var(--ui);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
h4{font-family:var(--disp);line-height:1.35;margin:0;font-weight:700}
code{font-family:var(--mono);font-size:.86em;background:var(--codebg);padding:1px 6px;border-radius:5px;white-space:nowrap}
:focus-visible{outline:3px solid var(--next);outline-offset:2px}
.wrap{max-width:1560px;margin:0 auto;padding:22px 22px 60px}
.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:26px;align-items:start}
.right{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.right{position:static}}

button{font:500 16px/1.4 var(--ui);color:var(--ink);background:var(--cell);border:1.5px solid var(--ink);border-radius:9px;padding:7px 15px;cursor:pointer}
button:hover:not(:disabled){background:var(--dcell)}
button:disabled{opacity:.42;cursor:not-allowed}
button.primary{background:var(--next);border-color:var(--next);color:#fff;font-weight:600}
:root[data-theme="dark"] button.primary{color:#0B111B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#0B111B}}
button.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--next)}
button.ghost{border-color:var(--line);color:var(--muted);font-size:15px;padding:4px 12px}
input[type=number]{font:500 17px var(--mono);width:84px;padding:6px 10px;border:1.5px solid var(--ink);border-radius:8px;background:var(--cell);color:var(--ink)}

.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin:8px 2px 0;font-size:14.5px;color:var(--muted)}
.legend i{display:inline-block;width:26px;height:4px;border-radius:2px;vertical-align:middle;margin-right:8px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin:0 0 14px}
.toolbar label{display:flex;align-items:center;gap:10px;font-weight:500}
.toolbar .presets{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.groups{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:12px 28px;margin-bottom:16px}
.grp h4{font-size:17px;color:var(--muted);margin-bottom:6px}
.grp .btns{display:flex;flex-wrap:wrap;gap:8px}
button.op.on{background:var(--ink);color:var(--bg)}
@media(max-width:900px){.groups{grid-template-columns:1fr}.toolbar .presets{margin-left:0}}

.stagewrap{border:1px solid var(--line);border-radius:14px;background-color:var(--stage);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;overflow-x:auto;position:relative}
.stagewrap svg{display:block;margin:0 auto}
.transport{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;margin:14px 0 4px}
.transport .count{color:var(--muted);font-size:16px;min-width:6.5em}
.transport .spd{display:flex;align-items:center;gap:8px;margin-left:auto;color:var(--muted);font-size:15px}
.transport input[type=range]{width:110px;accent-color:var(--next)}
.say{border-left:5px solid var(--next);padding:6px 0 6px 18px;margin-top:14px;min-height:132px;font-size:19px;line-height:1.7}
.say .k2{display:block;font-size:14px;color:var(--muted);margin-bottom:2px}
.say.warn{border-left-color:var(--prev)}
.say .done{display:inline-block;margin-top:6px;color:var(--head);font-weight:600}
.say small{color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chips span{border:1.5px solid var(--line);border-radius:999px;padding:1px 14px;font:500 14.5px/1.9 var(--mono);color:var(--muted)}
.chips b{color:var(--ink);font-weight:600}
.term{background:var(--codebg);border:1px solid var(--line);border-radius:9px;padding:10px 16px;font:500 15px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.term small{display:block;color:var(--muted);font:400 13px var(--ui);white-space:normal}

.codepanel{border:1px solid var(--line);border-radius:12px;background:var(--codebg);overflow:hidden}
.codepanel .ttl{padding:10px 16px;border-bottom:1px solid var(--line);font:600 14.5px var(--mono);color:var(--muted)}
#codeBody{padding:8px 0;overflow:auto;position:relative;max-height:calc(100vh - 96px);font:400 13.5px/1.7 var(--mono)}
@media(max-width:1000px){#codeBody{max-height:70vh}}
.cl{display:flex;white-space:pre;padding:0 14px 0 0;border-left:4px solid transparent;width:max-content;min-width:100%}
.cl .ln{flex:0 0 40px;text-align:right;padding-right:14px;color:var(--c-com);user-select:none}
.cl.dim{opacity:.42}
.cl.on{background:color-mix(in srgb,var(--hot) 24%,transparent);border-left-color:var(--hot)}
.c{color:var(--c-com);font-style:italic}.s{color:var(--c-str)}.p{color:var(--c-kw)}.k{color:var(--c-kw)}.t{color:var(--c-ty)}.n{color:var(--c-num)}.f{color:var(--c-fn)}

svg .nd .box{fill:var(--cell);stroke:var(--ink);stroke-width:2}
svg .nd .dc{fill:var(--dcell)}
svg .nd .sep{stroke:var(--ink);stroke-width:1.4;opacity:.5}
svg .nd .lbl{font:600 10.5px var(--ui);fill:var(--muted)}
svg .nd .val{font:600 22px var(--mono);fill:var(--ink)}
svg .nd .dp{fill:var(--prev)}
svg .nd .dn{fill:var(--next)}
svg .nd.visit .box{stroke:var(--cur);stroke-width:4}
svg .nd.found .box{stroke:var(--head);stroke-width:4}
svg .nd.seen .dc{fill:color-mix(in srgb,var(--cur) 28%,var(--cell))}
svg .nd.new .box,svg .nd.del .box{stroke-dasharray:6 4}
svg .nd.del .box{stroke:var(--prev);stroke-width:3.5}
svg .ar{fill:none;stroke-width:2.4;stroke-linecap:round}
svg .ar.next{stroke:var(--next)}
svg .ar.prev{stroke:var(--prev)}
svg .ar.hot{stroke:var(--hot);stroke-width:4.2;filter:drop-shadow(0 0 4px var(--hot))}
svg .ar.unk{stroke-dasharray:3 4}
svg .nulltx{font:italic 600 11px var(--mono);fill:var(--muted)}
svg .tl{fill:none;stroke:var(--muted);stroke-width:1.6}
svg .tag rect{fill:var(--tc,var(--muted))}
svg .tag text{font:600 12.5px var(--mono);fill:var(--ontag)}
svg .tag.hot rect{stroke:var(--hot);stroke-width:3;filter:drop-shadow(0 0 4px var(--hot))}
svg .t-head{--tc:var(--head)}svg .t-ptr{--tc:var(--cur)}svg .t-temp{--tc:var(--temp)}svg .t-temp1{--tc:var(--tail)}svg .t-new_node{--tc:var(--ink)}svg .t-last{--tc:var(--last)}
svg .empty{font:500 17px var(--ui);fill:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
<div class="layout">
  <div class="left">
    <div class="toolbar">
      <label for="valIn">Value <input id="valIn" type="number" value="25" min="-999" max="999"></label>
      <label for="posIn">Position <input id="posIn" type="number" value="2" min="1" max="9"></label>
      <span class="presets">
        <button class="ghost" id="pr1">Example list (10, 20, 30)</button>
        <button class="ghost" id="pr5">5 nodes</button>
        <button class="ghost" id="pr0">Empty list</button>
      </span>
    </div>
    <div class="groups">
      <div class="grp"><h4>Insert</h4><div class="btns">
        <button class="op" data-op="beginsert">1. Insert in beginning</button>
        <button class="op" data-op="endinsert">3. Insert at End</button>
        <button class="op" data-op="insertatanyplace">4. Insert at any place</button>
      </div></div>
      <div class="grp"><h4>Show</h4><div class="btns">
        <button class="op" data-op="display">2. Show</button>
      </div></div>
      <div class="grp"><h4>Delete</h4><div class="btns">
        <button class="op" data-op="begindelete">5. Delete from beginning</button>
        <button class="op" data-op="enddelete">6. Delete from end</button>
        <button class="op" data-op="deleteatanyplace">7. Delete at any place</button>
      </div></div>
    </div>

    <div class="stagewrap" id="stagewrap"><svg id="simSvg" role="img" aria-label="Doubly linked list simulation"></svg></div>
    <div class="legend">
      <span><i style="background:var(--next)"></i>next</span>
      <span><i style="background:var(--prev)"></i>prev</span>
      <span><i style="background:var(--hot)"></i>just changed</span>
      <span><i style="background:var(--cur);height:6px"></i>node being visited</span>
    </div>

    <div class="transport">
      <button id="btnBack">← Previous step</button>
      <button id="btnNext" class="primary">Next step →</button>
      <button id="btnAuto">Auto play</button>
      <span class="count" id="count"></span>
      <label class="spd">Slow <input id="speed" type="range" min="700" max="3200" step="100" value="1800" aria-label="Speed"> Fast</label>
    </div>

    <div class="say" id="say" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <div class="term" id="term" hidden></div>
  </div>

  <aside class="right">
    <div class="codepanel"><div class="ttl" id="codeTitle"></div><div id="codeBody"></div></div>
  </aside>
</div>
</main>

<script>
(function(){
"use strict";
const W=144,H=60,G=72,M=84,BASEY=178,FDY=138,MAXN=8;
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let nid=1;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const clone=o=>JSON.parse(JSON.stringify(o));
const f1=n=>Math.round(n*10)/10;

function highlight(code){
  const re=/(\/\/.*$|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*")|(#include\s*<[^>]+>)|\b(typedef|struct|void|int|if|else|while|for|return|sizeof|switch|case|default|break)\b|\b(NULL|node)\b|\b(\d+)\b|\b([A-Za-z_]\w*)(?=\()/gm;
  let out='',last=0,m;
  while((m=re.exec(code))){
    out+=esc(code.slice(last,m.index));
    const c=m[1]?'c':m[2]?'s':m[3]?'p':m[4]?'k':m[5]?'t':m[6]?'n':'f';
    out+='<span class="'+c+'">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  return out+esc(code.slice(last));
}

/* ---------- the program shown on the right (verbatim) ---------- */
const SRC=String.raw`#include<stdio.h>
#include<stdlib.h>
struct node
{
    int data;
    struct node *prev;
    struct node *next;
};
struct node *head=NULL;

void beginsert()
{
    struct node *ptr;
    ptr = malloc(sizeof(struct node));
    int item;
    scanf("%d",&item);
    ptr->data = item;
    ptr->prev = NULL;
    ptr->next = head;
    if(head!=NULL)
    {
        head->prev = ptr;
    }
    head = ptr;
    printf("\nNode inserted");
}
void endinsert()
{
    if(head==NULL)
    {
        printf("No Linked List Available");
    }
    else
    {
        struct node *temp=head;
        while(temp->next!=NULL)
        {
            temp=temp->next;
        }
        int value;
        struct node *ptr=malloc(sizeof(struct node));
        printf("Enter Value:");
        scanf("%d",&value);
        ptr->data=value;
        ptr->next=NULL;
        ptr->prev=temp;
        temp->next=ptr;
    }
}
void insertatanyplace()
{
   struct node *temp=head;
   printf("Enter position to enter:");
   int pos;
   scanf("%d",&pos);
   if(head==NULL || pos<2)
   {
       printf("Use 'Insert in beginning' for position 1");
       return;
   }
   for(int i=1;i<pos-1 && temp!=NULL;i++)
   {
       temp=temp->next;
   }
   if(temp==NULL)
   {
       printf("Position out of range");
       return;
   }
   struct node *temp1=temp->next;
   struct node *new_node=malloc(sizeof(struct node));
   printf("Enter Value to Insert:");
   int val;
   scanf("%d",&val);
   new_node->data=val;
   new_node->next=temp1;
   new_node->prev=temp;
   if(temp1!=NULL)
   {
       temp1->prev=new_node;
   }
   temp->next=new_node;
}
void begindelete()
{
    struct node *ptr;
    if(head==NULL)
    {
        printf("\nList is empty");
    }
    else
    {
        ptr = head;
        head = head->next;
        if(head!=NULL)
        {
            head->prev = NULL;
        }
        free(ptr);
        printf("\nNode deleted from the beginning");
    }
}
void enddelete()
{
    struct node *ptr;
    if(head==NULL)
    {
        printf("\nList is empty");
    }
    else
    {
        ptr = head;
        while(ptr->next!=NULL)
        {
            ptr = ptr->next;
        }
        if(ptr->prev==NULL)
        {
            head = NULL;
        }
        else
        {
            ptr->prev->next = NULL;
        }
        free(ptr);
        printf("\nNode deleted from the end");
    }
}
void deleteatanyplace()
{
    struct node *temp=head;
    int pos;
    if(head==NULL)
    {
        printf("\nList is empty");
        return;
    }
    printf("Enter position to delete:");
    scanf("%d",&pos);
    if(pos<1)
    {
        printf("Position out of range");
        return;
    }
    for(int i=1;i<pos && temp!=NULL;i++)
    {
        temp=temp->next;
    }
    if(temp==NULL)
    {
        printf("Position out of range");
        return;
    }
    if(temp->prev==NULL)
    {
        head = temp->next;
    }
    else
    {
        temp->prev->next = temp->next;
    }
    if(temp->next!=NULL)
    {
        temp->next->prev = temp->prev;
    }
    free(temp);
    printf("\nNode deleted");
}
void display()
{
    struct node *ptr;
    struct node *last=NULL;
    ptr = head;

    printf("\nprinting values (forward) . . . . .\n");
    while (ptr!=NULL)
    {
        printf("%d-> ",ptr->data);
        last = ptr;
        ptr = ptr -> next;
    }

    printf("\nprinting values (backward) . . . . .\n");
    ptr = last;
    while (ptr!=NULL)
    {
        printf("%d-> ",ptr->data);
        ptr = ptr -> prev;
    }
}
void main ()
{
    int choice =0;
    while(1)
    {
        printf("\n\n*********Main Menu*********\n");
        printf("\nChoose one option from the following list ...\n");
        printf("\n===============================================\n");
        printf("\n1.Insert in beginning\n2.Show\n3.Insert at End\n4.Insert at any place\n5.Delete from beginning\n6.Delete from end\n7.Delete at any place\n8.Exit");
        printf("\nEnter your choice?\n");
        scanf("\n%d",&choice);
        switch(choice)
        {
        case 1:
            beginsert();
            break;
        case 2:
            display();
            break;
        case 3:
            endinsert();
            break;
        case 4:
            insertatanyplace();
            break;
        case 5:
            begindelete();
            break;
        case 6:
            enddelete();
            break;
        case 7:
            deleteatanyplace();
            break;
        case 8:
            exit(0);

        default:
            printf("Please enter valid choice..");
        }
    }
}`;
const LINES=SRC.split('\n');
const MENU={beginsert:1,display:2,endinsert:3,insertatanyplace:4,begindelete:5,enddelete:6,deleteatanyplace:7};
function fnRange(name){
  const s=LINES.findIndex(l=>l.indexOf('void '+name)===0);
  let e=s;while(LINES[e]!=='}')e++;
  return [s,e];
}
function mkAt(name){
  const r=fnRange(name),s=r[0],e=r[1];
  return (pat,nth)=>{
    let c=0;
    for(let i=s;i<=e;i++){
      if(LINES[i].indexOf(pat)>=0){c++;if(c===(nth||1))return i+1;}
    }
    throw new Error('line not found in '+name+': '+pat);
  };
}

/* ---------- state ---------- */
function mkState(vals){
  const S={nodes:{},order:[],head:null,tags:{},vars:{},hl:[],out:null};
  let prev=null;
  vals.forEach(v=>{
    const id=nid++;
    S.nodes[id]={id,val:v,prev,next:null,fl:0,cls:''};
    if(prev!==null)S.nodes[prev].next=id;
    S.order.push(id);prev=id;
  });
  if(S.order.length)S.head=S.order[0];
  return S;
}

/* ---------- Stage: SVG renderer with smooth motion ---------- */
let uidc=0;
class Stage{
  constructor(svg,o){
    this.svg=svg;this.o=o||{};this.S=null;this.vis={};this.raf=0;this.snap=false;
    this.u='m'+(++uidc)+'_';const u=this.u;
    const mk=(id,c)=>'<marker id="'+u+id+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:'+c+'"/></marker>';
    svg.innerHTML='<defs>'+mk('n','var(--next)')+mk('p','var(--prev)')+mk('h','var(--hot)')+mk('t','var(--muted)')+'</defs><g class="layer"></g>';
    this.layer=svg.querySelector('.layer');
  }
  layout(S){
    const n=Math.max(S.order.length,1);
    const cw=2*M+n*W+(n-1)*G;
    const w=Math.max(cw,this.o.minW||0);
    return {w:w,ox:(w-cw)/2};
  }
  reset(S){this.vis={};this.set(S,true);}
  set(S,snap){this.S=S;this.snap=!!snap||REDUCED;this.kick();}
  kick(){if(!this.raf)this.raf=requestAnimationFrame(()=>{this.raf=0;this.frame();});}
  follow(id){
    const sc=this.o.scroller;if(!sc||!this.S||id==null)return;
    const i=this.S.order.indexOf(id);if(i<0)return;
    const L=this.layout(this.S);
    const x=L.ox+M+i*(W+G)+W/2;
    if(sc.scrollWidth>sc.clientWidth+4){
      sc.scrollTo({left:this.svg.offsetLeft+x-sc.clientWidth/2,behavior:REDUCED?'auto':'smooth'});
    }
  }
  frame(){
    const S=this.S;if(!S)return;
    const base=this.o.base!=null?this.o.base:BASEY, u=this.u, vis=this.vis;
    const L=this.layout(S), ord=S.order;
    const T={};
    ord.forEach((id,i)=>{const n=S.nodes[id];T[id]={x:L.ox+M+i*(W+G),y:base-n.fl*FDY,o:1};});
    ord.forEach(id=>{
      if(!vis[id])vis[id]={x:T[id].x,y:T[id].y,o:this.snap?1:0,g:false,val:S.nodes[id].val};
      vis[id].g=false;vis[id].val=S.nodes[id].val;
    });
    for(const id in vis){
      if(!T[id]){const v=vis[id];if(!v.g){v.g=true;v.ty=v.y+64;}T[id]={x:v.x,y:v.ty,o:0};}
    }
    let moving=false;
    const k=this.snap?1:0.2,ko=this.snap?1:0.16;
    for(const id in vis){
      const v=vis[id],t=T[id];
      const dx=t.x-v.x,dy=t.y-v.y,dO=t.o-v.o;
      if(Math.abs(dx)>0.3||Math.abs(dy)>0.3||Math.abs(dO)>0.02){
        moving=true;v.x+=dx*k;v.y+=dy*k;v.o+=dO*ko;
      }else{v.x=t.x;v.y=t.y;v.o=t.o;}
      if(v.g&&v.o<0.03)delete vis[id];
    }
    let nodes='',arrN='',arrH='',tags='';
    const nodeMk=(v,val,cls)=>'<g transform="translate('+f1(v.x)+' '+f1(v.y)+')" opacity="'+v.o.toFixed(2)+'" class="nd '+cls+'">'
      +'<rect class="box" width="'+W+'" height="'+H+'" rx="9"/>'
      +'<rect class="dc" x="40" y="1.2" width="64" height="'+(H-2.4)+'"/>'
      +'<path class="sep" d="M40 0V'+H+'M104 0V'+H+'"/>'
      +'<text class="lbl" x="20" y="13" text-anchor="middle">prev</text>'
      +'<text class="lbl" x="124" y="'+(H-5)+'" text-anchor="middle">next</text>'
      +'<text class="val" x="72" y="'+(H/2+8)+'" text-anchor="middle">'+esc(val)+'</text>'
      +'<circle class="dp" cx="20" cy="39" r="4"/><circle class="dn" cx="124" cy="21" r="4"/></g>';
    for(const id in vis){
      const v=vis[id],n=S.nodes[id];
      if(!n||v.g){nodes+=nodeMk(v,v.val,'del');continue;}
      let cls=n.cls||'';
      if(n.fl)cls+=' new';
      nodes+=nodeMk(v,n.val,cls);
    }
    const arrow=(id,kind,v,n)=>{
      const t=kind==='next'?n.next:n.prev;
      const sx=kind==='next'?v.x+W-20:v.x+20, sy=v.y+(kind==='next'?21:39);
      const hot=S.hl.indexOf(id+'.'+kind)>=0;
      const mkr=hot?'h':(kind==='next'?'n':'p');
      if(t==='?'){
        const ex=kind==='next'?v.x+W+22:v.x-22;
        return ['<g opacity="'+v.o.toFixed(2)+'"><path class="ar unk '+kind+(hot?' hot':'')+'" d="M'+f1(sx)+' '+f1(sy)+'H'+f1(ex)+'"/><text class="nulltx" x="'+f1(ex+(kind==='next'?6:-6))+'" y="'+f1(sy+4)+'" text-anchor="'+(kind==='next'?'start':'end')+'">?</text></g>',hot];
      }
      if(t==null){
        const ex=kind==='next'?v.x+W+26:v.x-26;
        return ['<g opacity="'+v.o.toFixed(2)+'"><path class="ar '+kind+(hot?' hot':'')+'" d="M'+f1(sx)+' '+f1(sy)+'H'+f1(ex)+'"/><path class="ar '+kind+'" d="M'+f1(ex)+' '+f1(sy-6)+'V'+f1(sy+6)+'"/><text class="nulltx" x="'+f1(ex+(kind==='next'?6:-6))+'" y="'+f1(sy+4)+'" text-anchor="'+(kind==='next'?'start':'end')+'">NULL</text></g>',hot];
      }
      const tv=vis[t];if(!tv)return ['',false];
      const tx=kind==='next'?tv.x:tv.x+W, ty=tv.y+(kind==='next'?21:39);
      const mx=(sx+tx)/2;
      const d=Math.abs(ty-sy)<0.5?'M'+f1(sx)+' '+f1(sy)+'H'+f1(tx):'M'+f1(sx)+' '+f1(sy)+'C'+f1(mx)+' '+f1(sy)+' '+f1(mx)+' '+f1(ty)+' '+f1(tx)+' '+f1(ty);
      return ['<path class="ar '+kind+(hot?' hot':'')+'" marker-end="url(#'+u+mkr+')" d="'+d+'" opacity="'+Math.min(v.o,tv.o).toFixed(2)+'"/>',hot];
    };
    ord.forEach(id=>{
      const n=S.nodes[id],v=vis[id];
      ['next','prev'].forEach(kind=>{
        const r=arrow(id,kind,v,n);
        if(r[1])arrH+=r[0];else arrN+=r[0];
      });
    });
    /* pointer variables: head + every local variable */
    const list=[['head',S.head]];
    for(const k in S.tags)list.push([k,S.tags[k]]);
    const by={};
    list.forEach(p=>{
      const id=p[1];
      if(id!=null&&id!=='?'&&vis[id]&&!vis[id].g&&S.nodes[id]){(by[id]=by[id]||[]).push(p[0]);}
    });
    const pw=nm=>Math.max(40,nm.length*8+22);
    for(const id in by){
      const v=vis[id],n=S.nodes[id],cx=v.x+W/2,up=!!n.fl,top=v.y+H;
      tags+='<g opacity="'+v.o.toFixed(2)+'">';
      if(up)tags+='<path class="tl" d="M'+f1(cx)+' '+f1(v.y-7)+'V'+f1(v.y-1)+'" marker-end="url(#'+u+'t)"/>';
      else tags+='<path class="tl" d="M'+f1(cx)+' '+f1(top+17)+'V'+f1(top+2)+'" marker-end="url(#'+u+'t)"/>';
      by[id].forEach((nm,i)=>{
        const hot=S.hl.indexOf(nm)>=0,w=pw(nm);
        const ty=up?v.y-28-i*26:top+17+i*26;
        tags+='<g class="tag t-'+nm+(hot?' hot':'')+'" transform="translate('+f1(cx-w/2)+' '+f1(ty)+')"><rect width="'+w+'" height="21" rx="10.5"/><text x="'+f1(w/2)+'" y="15" text-anchor="middle">'+nm+'</text></g>';
      });
      tags+='</g>';
    }
    let empty='';
    if(!ord.length&&!Object.keys(vis).length){
      empty='<text class="empty" x="'+f1(L.w/2)+'" y="'+f1(base+36)+'" text-anchor="middle">Empty list — head = NULL</text>';
    }
    const h=this.o.h||392;
    this.svg.setAttribute('width',L.w);this.svg.setAttribute('height',h);
    this.svg.setAttribute('viewBox','0 0 '+L.w+' '+h);
    this.layer.innerHTML=nodes+arrN+arrH+tags+empty;
    if(moving)this.kick();
  }
}

/* ---------- simulation ---------- */
const wrap=document.getElementById('stagewrap');
const stage=new Stage(document.getElementById('simSvg'),{base:BASEY,h:392,minW:600,scroller:wrap});
let S=mkState([10,20,30]);
stage.set(S,true);

const el=id=>document.getElementById(id);
const sayEl=el('say'),chipsEl=el('chips'),termEl=el('term'),codeBody=el('codeBody'),codeTitle=el('codeTitle'),countEl=el('count');
const btnNext=el('btnNext'),btnBack=el('btnBack'),btnAuto=el('btnAuto'),speedEl=el('speed');
let cur={steps:[],pos:-1,hist:[],intro:'',fn:null};
let timer=null;

function build(op,a){
  const ord=S.order.slice(),N=S.nodes,val=id=>N[id].val,size=ord.length,at=mkAt(op);
  const steps=[],st=(line,msg,fn)=>steps.push({line:line,msg:msg,fn:fn||function(){}});
  const nm=id=>id==null?'NULL':val(id);
  const drop=(s,id)=>{s.nodes[id].fl=0;s.nodes[id].cls='';};
  const visit=(s,id)=>{for(const k in s.nodes){if(s.nodes[k].cls==='visit')s.nodes[k].cls='';}if(id!=null&&s.nodes[id])s.nodes[id].cls='visit';};
  const rm=(s,id)=>{delete s.nodes[id];s.order=s.order.filter(x=>x!==id);for(const k in s.tags)if(s.tags[k]===id)delete s.tags[k];};
  const put=(s,t)=>{s.out=(s.out||'')+t;};
  const mkNode=(line,id,slot,name)=>st(line,'<code>malloc(sizeof(struct node))</code> — memory for one node is allocated on the heap. <code>malloc</code> does not clear it, so <code>data</code>, <code>prev</code> and <code>next</code> hold garbage values (shown as <b>?</b>). The pointer <code>'+name+'</code> now holds its address.',
    s=>{s.nodes[id]={id:id,val:'?',prev:'?',next:'?',fl:1,cls:''};s.order.splice(slot,0,id);s.tags[name]=id;s.hl=[name];});
  let title=op+'()',intro='';
  const opn=MENU[op];

  switch(op){
  case 'beginsert':{
    const v=a.v,id=nid++,old=S.head;
    intro='<code>beginsert()</code> — menu option 1. Insert <b>'+v+'</b> at the beginning. Think first: which pointers will change?';
    st(at('struct node *ptr;'),'<code>struct node *ptr;</code> — a pointer variable <code>ptr</code> is declared. It does not point to any node yet (it holds garbage).',s=>{s.tags.ptr='?';});
    mkNode(at('ptr = malloc'),id,0,'ptr');
    st([at('int item;'),at('scanf')],'<code>int item;</code> declares a variable and <code>scanf</code> reads the number the user typed ('+v+') into it.',s=>{s.vars.item=v;});
    st(at('ptr->data = item;'),'<code>ptr->data = item;</code> — the node now stores '+v+'.',s=>{s.nodes[id].val=v;});
    st(at('ptr->prev = NULL;'),'<code>ptr->prev = NULL;</code> — nothing will come before the new first node, so its <code>prev</code> is NULL.',s=>{s.nodes[id].prev=null;s.hl=[id+'.prev'];});
    st(at('ptr->next = head;'),old===null?'<code>ptr->next = head;</code> — head is NULL (the list is empty), so <code>next</code> becomes NULL.':'<code>ptr->next = head;</code> — the new node\'s <code>next</code> points to the current first node ('+val(old)+').',s=>{s.nodes[id].next=old;s.hl=[id+'.next'];});
    st(at('if(head!=NULL)'),'<code>head != NULL</code>? '+(old!==null?'Yes — there is an old first node, and it must learn about the new node.':'No — the list was empty, so there is no old node to link back.'));
    if(old!==null)st(at('head->prev = ptr;'),'<code>head->prev = ptr;</code> — the old first node ('+val(old)+') now points back to the new node. Links exist in both directions.',s=>{s.nodes[old].prev=id;s.hl=[old+'.prev'];});
    st(at('head = ptr;'),'<code>head = ptr;</code> — head now points to the new node, so it is officially the first node.',s=>{s.head=id;drop(s,id);s.hl=['head'];});
    st(at('Node inserted'),'<code>printf</code> prints a confirmation. The function ends and its local variables disappear.',s=>{put(s,'Node inserted');});
    break;}

  case 'endinsert':{
    const v=a.v,id=nid++;
    intro='<code>endinsert()</code> — menu option 3. Insert <b>'+v+'</b> at the end. Think first: how do we find the last node?';
    st(at('if(head==NULL)'),'<code>head == NULL</code>? '+(size?'No — the list has nodes, so the <code>else</code> part runs.':'Yes — the list is empty.'));
    if(!size){st(at('No Linked List Available'),'<code>printf</code> prints "No Linked List Available". Nothing is inserted. (Use option 1 first to create the first node.)',s=>{put(s,'No Linked List Available');});break;}
    st(at('struct node *temp=head;'),'<code>temp = head</code> — <code>temp</code> starts at the first node and will walk to the last one.',s=>{s.tags.temp=ord[0];visit(s,ord[0]);s.hl=['temp'];});
    for(let k=0;;k++){
      const more=k<size-1;
      st(at('while(temp->next!=NULL)'),'<code>temp->next != NULL</code>? '+(more?'Yes, there is a node after '+val(ord[k])+' — keep walking.':'No — '+val(ord[k])+' is the last node. The loop stops.'));
      if(!more)break;
      const nx=ord[k+1];
      st(at('temp=temp->next;'),'<code>temp = temp->next;</code> — temp moves forward to '+val(nx)+'.',s=>{s.tags.temp=nx;visit(s,nx);s.hl=['temp'];});
    }
    const last=ord[size-1];
    st([at('int value;'),at('struct node *ptr=malloc')],'<code>int value;</code> is declared. Then <code>malloc(sizeof(struct node))</code> allocates a new node on the heap. It holds garbage (<b>?</b>), and <code>ptr</code> holds its address.',
      s=>{s.nodes[id]={id:id,val:'?',prev:'?',next:'?',fl:1,cls:''};s.order.splice(size,0,id);s.tags.ptr=id;s.hl=['ptr'];});
    st(at('Enter Value:'),'<code>printf</code> shows the prompt on the console.',s=>{put(s,'Enter Value:');});
    st(at('scanf'),'<code>scanf</code> reads the number typed by the user ('+v+') into <code>value</code>.',s=>{s.vars.value=v;put(s,v+'\n');});
    st(at('ptr->data=value;'),'<code>ptr->data = value;</code> — the new node stores '+v+'.',s=>{s.nodes[id].val=v;});
    st(at('ptr->next=NULL;'),'<code>ptr->next = NULL;</code> — the new node will be the last, so nothing comes after it.',s=>{s.nodes[id].next=null;s.hl=[id+'.next'];});
    st(at('ptr->prev=temp;'),'<code>ptr->prev = temp;</code> — the new node\'s <code>prev</code> points to the current last node ('+val(last)+').',s=>{s.nodes[id].prev=last;s.hl=[id+'.prev'];});
    st(at('temp->next=ptr;'),'<code>temp->next = ptr;</code> — the old last node ('+val(last)+') now points forward to the new node. Both directions are linked and the node settles into the row.',s=>{s.nodes[last].next=id;drop(s,id);s.hl=[last+'.next'];});
    break;}

  case 'insertatanyplace':{
    const v=a.v,p=a.p,id=nid++;
    intro='<code>insertatanyplace()</code> — menu option 4. Insert <b>'+v+'</b> at position <b>'+p+'</b>. The new node goes between node '+(p-1)+' and the node after it.';
    st(at('struct node *temp=head;'),'<code>temp = head;</code> — <code>temp</code> starts at the first node.',s=>{s.tags.temp=size?ord[0]:null;visit(s,size?ord[0]:null);s.hl=['temp'];});
    st(at('Enter position to enter:'),'<code>printf</code> shows the prompt on the console.',s=>{put(s,'Enter position to enter:');});
    st([at('int pos;'),at('scanf',1)],'<code>int pos;</code> is declared and <code>scanf</code> reads the position typed by the user ('+p+').',s=>{s.vars.pos=p;put(s,p+'\n');});
    const early=(size===0||p<2);
    st(at('if(head==NULL || pos<2)'),'<code>head == NULL || pos &lt; 2</code>? '+(early?(size===0?'Yes — the list is empty.':'Yes — position '+p+' is less than 2, so this is not a middle insertion.'):'No — the list has nodes and pos ('+p+') is at least 2.'));
    if(early){st([at('Use \'Insert in beginning\''),at('Use \'Insert in beginning\'')+1],'<code>printf</code> tells the user to use "Insert in beginning" for position 1, then <code>return</code> ends the function. Nothing was inserted.',s=>{put(s,'Use \'Insert in beginning\' for position 1');});break;}
    let i=1,t=0;
    for(let first=true;;first=false){
      const c1=i<p-1,c2=t<size,cond=c1&&c2,iv=i;
      st(at('for(int i=1'),(first?'<code>int i = 1;</code> — the loop counter starts at 1. ':'<code>i++</code> — i becomes '+iv+'. ')+'Check: <code>i &lt; pos-1</code> is '+iv+' &lt; '+(p-1)+' → '+c1+', and <code>temp != NULL</code> → '+c2+'. '+(cond?'<b>Both true</b> — run the loop body.':'<b>The loop stops.</b>'),s=>{s.vars.i=iv;});
      if(!cond)break;
      t++;const tt=t,tid=t<size?ord[t]:null;
      st(at('temp=temp->next;'),'<code>temp = temp->next;</code> — temp moves forward'+(tid!==null?' to '+val(tid)+'.':' and falls off the end: temp is now NULL.'),s=>{s.tags.temp=tid;visit(s,tid);s.hl=['temp'];});
      i++;
    }
    const isNull=t>=size;
    st(at('if(temp==NULL)'),'<code>temp == NULL</code>? '+(isNull?'Yes — we walked past the end of the list, so the position is too large.':'No — temp is on node '+(p-1)+' ('+val(ord[t])+'), the node after which we will insert.'));
    if(isNull){st([at('Position out of range'),at('Position out of range')+1],'<code>printf</code> prints "Position out of range" and <code>return</code> ends the function. Nothing was inserted.',s=>{put(s,'Position out of range');});break;}
    const curId=ord[t],after=t+1<size?ord[t+1]:null;
    st(at('struct node *temp1=temp->next;'),'<code>temp1 = temp->next;</code> — <code>temp1</code> remembers the node after temp ('+nm(after)+'). We need it later, because <code>temp->next</code> is about to change.',s=>{s.tags.temp1=after;s.hl=['temp1'];});
    st(at('struct node *new_node=malloc'),'<code>malloc(sizeof(struct node))</code> — a new node is allocated on the heap. It holds garbage (<b>?</b>), and <code>new_node</code> holds its address.',
      s=>{s.nodes[id]={id:id,val:'?',prev:'?',next:'?',fl:1,cls:''};s.order.splice(t+1,0,id);s.tags.new_node=id;s.hl=['new_node'];});
    st(at('Enter Value to Insert:'),'<code>printf</code> shows the prompt on the console.',s=>{put(s,'\nEnter Value to Insert:');});
    st([at('int val;'),at('scanf',2)],'<code>int val;</code> is declared and <code>scanf</code> reads the number typed by the user ('+v+').',s=>{s.vars.val=v;put(s,v+'\n');});
    st(at('new_node->data=val;'),'<code>new_node->data = val;</code> — the node stores '+v+'.',s=>{s.nodes[id].val=v;});
    st(at('new_node->next=temp1;'),'<code>new_node->next = temp1;</code> — the new node\'s <code>next</code> points to the node after temp ('+nm(after)+').',s=>{s.nodes[id].next=after;s.hl=[id+'.next'];});
    st(at('new_node->prev=temp;'),'<code>new_node->prev = temp;</code> — the new node\'s <code>prev</code> points to temp ('+val(curId)+'). The new node is set on both sides, but its neighbours do not know about it yet.',s=>{s.nodes[id].prev=curId;s.hl=[id+'.prev'];});
    st(at('if(temp1!=NULL)'),'<code>temp1 != NULL</code>? '+(after!==null?'Yes — there is a node after temp, and it must point back to the new node.':'No — temp was the last node, so there is no next node to update.'));
    if(after!==null)st(at('temp1->prev=new_node;'),'<code>temp1->prev = new_node;</code> — the node after temp ('+val(after)+') now points back to the new node.',s=>{s.nodes[after].prev=id;s.hl=[after+'.prev'];});
    st(at('temp->next=new_node;'),'<code>temp->next = new_node;</code> — temp ('+val(curId)+') now points forward to the new node. All four links are connected and the node settles into the row. <b>Order matters:</b> we saved the old next in <code>temp1</code> first, so nothing was lost.',s=>{s.nodes[curId].next=id;drop(s,id);s.hl=[curId+'.next'];});
    break;}

  case 'begindelete':{
    intro='<code>begindelete()</code> — menu option 5. Delete the first node. Think first: which pointers must move?';
    st(at('struct node *ptr;'),'<code>struct node *ptr;</code> — a pointer variable <code>ptr</code> is declared. It holds garbage for now.',s=>{s.tags.ptr='?';});
    st(at('if(head==NULL)'),'<code>head == NULL</code>? '+(size?'No — there is a node to delete, so the <code>else</code> part runs.':'Yes — the list is empty.'));
    if(!size){st(at('List is empty'),'<code>printf</code> prints "List is empty". Nothing to delete.',s=>{put(s,'List is empty');});break;}
    const t=ord[0],nx=size>1?ord[1]:null;
    st(at('ptr = head;'),'<code>ptr = head;</code> — <code>ptr</code> holds on to the first node ('+val(t)+'), the one we will delete. Without it, the node would be lost once head moves.',s=>{s.tags.ptr=t;s.nodes[t].cls='del';s.hl=['ptr'];});
    st(at('head = head->next;'),'<code>head = head->next;</code> — head moves forward to '+nm(nx)+'.',s=>{s.head=nx;s.hl=['head'];});
    st(at('if(head!=NULL)'),'<code>head != NULL</code>? '+(nx!==null?'Yes — there is a new first node.':'No — the list is now empty, so there is no <code>prev</code> to fix.'));
    if(nx!==null)st(at('head->prev = NULL;'),'<code>head->prev = NULL;</code> — the new first node ('+val(nx)+') must no longer point back at the deleted node, so its <code>prev</code> becomes NULL.',s=>{s.nodes[nx].prev=null;s.hl=[nx+'.prev'];});
    st(at('free(ptr);'),'<code>free(ptr);</code> — the deleted node\'s memory is given back.',s=>{rm(s,t);});
    st(at('Node deleted from the beginning'),'<code>printf</code> prints a confirmation. Done!',s=>{put(s,'Node deleted from the beginning');});
    break;}

  case 'enddelete':{
    intro='<code>enddelete()</code> — menu option 6. Delete the last node. Think first: how do we reach it, and what must the node before it do?';
    st(at('struct node *ptr;'),'<code>struct node *ptr;</code> — a pointer variable <code>ptr</code> is declared. It holds garbage for now.',s=>{s.tags.ptr='?';});
    st(at('if(head==NULL)'),'<code>head == NULL</code>? '+(size?'No — there is a node to delete, so the <code>else</code> part runs.':'Yes — the list is empty.'));
    if(!size){st(at('List is empty'),'<code>printf</code> prints "List is empty". Nothing to delete.',s=>{put(s,'List is empty');});break;}
    st(at('ptr = head;'),'<code>ptr = head;</code> — <code>ptr</code> starts at the first node and will walk to the last one.',s=>{s.tags.ptr=ord[0];visit(s,ord[0]);s.hl=['ptr'];});
    for(let k=0;;k++){
      const more=k<size-1;
      st(at('while(ptr->next!=NULL)'),'<code>ptr->next != NULL</code>? '+(more?'Yes, there is a node after '+val(ord[k])+' — keep walking.':'No — '+val(ord[k])+' is the last node. The loop stops.'));
      if(!more)break;
      const nx=ord[k+1];
      st(at('ptr = ptr->next;'),'<code>ptr = ptr->next;</code> — ptr moves forward to '+val(nx)+'.',s=>{s.tags.ptr=nx;visit(s,nx);s.hl=['ptr'];});
    }
    const last=ord[size-1],pv=size>1?ord[size-2]:null;
    st(at('if(ptr->prev==NULL)'),'<code>ptr->prev == NULL</code>? '+(pv===null?'Yes — this is the only node in the list.':'No — there is a node before it ('+val(pv)+'). This is where <code>prev</code> helps: we can reach it directly.'),s=>{visit(s,null);s.nodes[last].cls='del';});
    if(pv===null)st(at('head = NULL;'),'<code>head = NULL;</code> — the only node is going away, so the list becomes empty.',s=>{s.head=null;s.hl=['head'];});
    else st(at('ptr->prev->next = NULL;'),'<code>ptr->prev->next = NULL;</code> — the node before the last ('+val(pv)+') now has <code>next</code> = NULL, so it becomes the new last node.',s=>{s.nodes[pv].next=null;s.hl=[pv+'.next'];});
    st(at('free(ptr);'),'<code>free(ptr);</code> — the deleted node\'s memory is given back.',s=>{rm(s,last);});
    st(at('Node deleted from the end'),'<code>printf</code> prints a confirmation. Done!',s=>{put(s,'Node deleted from the end');});
    break;}

  case 'deleteatanyplace':{
    const p=a.p;
    intro='<code>deleteatanyplace()</code> — menu option 7. Delete the node at position <b>'+p+'</b>. One function handles first, middle and last nodes.';
    st([at('struct node *temp=head;'),at('int pos;')],'<code>temp = head;</code> — <code>temp</code> starts at the first node. <code>int pos;</code> is declared.',s=>{s.tags.temp=size?ord[0]:null;visit(s,size?ord[0]:null);s.hl=['temp'];});
    st(at('if(head==NULL)'),'<code>head == NULL</code>? '+(size?'No — the list has nodes.':'Yes — the list is empty.'));
    if(!size){st([at('List is empty'),at('List is empty')+1],'<code>printf</code> prints "List is empty" and <code>return</code> ends the function.',s=>{put(s,'List is empty');});break;}
    st(at('Enter position to delete:'),'<code>printf</code> shows the prompt on the console.',s=>{put(s,'Enter position to delete:');});
    st(at('scanf'),'<code>scanf</code> reads the position typed by the user ('+p+') into <code>pos</code>.',s=>{s.vars.pos=p;put(s,p+'\n');});
    st(at('if(pos<1)'),'<code>pos &lt; 1</code>? '+(p<1?'Yes — positions start at 1.':'No — '+p+' is a valid starting point.'));
    if(p<1){st([at('Position out of range'),at('Position out of range')+1],'<code>printf</code> prints "Position out of range" and <code>return</code> ends the function.',s=>{put(s,'Position out of range');});break;}
    let i=1,t=0;
    for(let first=true;;first=false){
      const c1=i<p,c2=t<size,cond=c1&&c2,iv=i;
      st(at('for(int i=1'),(first?'<code>int i = 1;</code> — the loop counter starts at 1. ':'<code>i++</code> — i becomes '+iv+'. ')+'Check: <code>i &lt; pos</code> is '+iv+' &lt; '+p+' → '+c1+', and <code>temp != NULL</code> → '+c2+'. '+(cond?'<b>Both true</b> — run the loop body.':'<b>The loop stops.</b>'),s=>{s.vars.i=iv;});
      if(!cond)break;
      t++;const tid=t<size?ord[t]:null;
      st(at('temp=temp->next;'),'<code>temp = temp->next;</code> — temp moves forward'+(tid!==null?' to '+val(tid)+'.':' and falls off the end: temp is now NULL.'),s=>{s.tags.temp=tid;visit(s,tid);s.hl=['temp'];});
      i++;
    }
    const isNull=t>=size;
    st(at('if(temp==NULL)'),'<code>temp == NULL</code>? '+(isNull?'Yes — position '+p+' is beyond the end of the list.':'No — temp is on position '+p+' ('+val(ord[t])+'), the node to delete.'));
    if(isNull){st([at('Position out of range',2),at('Position out of range',2)+1],'<code>printf</code> prints "Position out of range" and <code>return</code> ends the function.',s=>{put(s,'Position out of range');});break;}
    const c=ord[t],pv=t>0?ord[t-1]:null,nx=t<size-1?ord[t+1]:null;
    st(at('if(temp->prev==NULL)'),'<code>temp->prev == NULL</code>? '+(pv===null?'Yes — this is the first node, so head must move.':'No — there is a node before it ('+val(pv)+').'),s=>{visit(s,null);s.nodes[c].cls='del';});
    if(pv===null)st(at('head = temp->next;'),'<code>head = temp->next;</code> — head moves forward to '+nm(nx)+'.',s=>{s.head=nx;s.hl=['head'];});
    else st(at('temp->prev->next = temp->next;'),'<code>temp->prev->next = temp->next;</code> — the node before ('+val(pv)+') now points forward to '+nm(nx)+', skipping the node being deleted.',s=>{s.nodes[pv].next=nx;s.hl=[pv+'.next'];});
    st(at('if(temp->next!=NULL)'),'<code>temp->next != NULL</code>? '+(nx!==null?'Yes — there is a node after it ('+val(nx)+'), and it must point back past the deleted node.':'No — this is the last node, so there is nothing after it to fix.'));
    if(nx!==null)st(at('temp->next->prev = temp->prev;'),'<code>temp->next->prev = temp->prev;</code> — the node after ('+val(nx)+') now points back to '+nm(pv)+'. The deleted node is skipped from both sides.',s=>{s.nodes[nx].prev=pv;s.hl=[nx+'.prev'];});
    st(at('free(temp);'),'<code>free(temp);</code> — the deleted node is no longer linked to anything, so its memory is given back.',s=>{rm(s,c);});
    st(at('Node deleted'),'<code>printf</code> prints a confirmation. Done!',s=>{put(s,'Node deleted');});
    break;}

  case 'display':{
    intro='<code>display()</code> — menu option 2. Print the list forward using <code>next</code>, then backward using <code>prev</code>. The backward pass is only possible in a doubly linked list.';
    st([at('struct node *ptr;'),at('struct node *last=NULL;')],'Two pointers are declared: <code>ptr</code> (garbage for now) and <code>last</code>, which starts as NULL.',s=>{s.tags.ptr='?';s.tags.last=null;});
    st(at('ptr = head;'),'<code>ptr = head;</code> — <code>ptr</code> starts at the first node.',s=>{s.tags.ptr=size?ord[0]:null;visit(s,size?ord[0]:null);s.hl=['ptr'];});
    st(at('(forward)'),'<code>printf</code> prints the forward heading.',s=>{put(s,'\nprinting values (forward) . . . . .\n');});
    ord.forEach((id,k)=>{
      const x=val(id),nx=k+1<size?ord[k+1]:null;
      st(at('while (ptr!=NULL)',1),'<code>ptr != NULL</code> → true. ptr is on node '+x+'.');
      st(at('printf("%d-> "',1),'<code>printf</code> prints '+x+'.',s=>{put(s,x+'-> ');s.nodes[id].cls='seen';});
      st(at('last = ptr;'),'<code>last = ptr;</code> — <code>last</code> remembers this node. When the loop ends, last will hold the final node.',s=>{s.tags.last=id;s.hl=['last'];});
      st(at('ptr = ptr -> next;'),'<code>ptr = ptr -> next;</code> — ptr moves forward'+(nx!==null?' to '+val(nx)+'.':' and becomes NULL.'),s=>{s.tags.ptr=nx;if(nx!==null){const keep=s.nodes[nx].cls;if(keep!=='seen')s.nodes[nx].cls='visit';}s.hl=['ptr'];});
    });
    st(at('while (ptr!=NULL)',1),'<code>ptr != NULL</code> → false. The forward loop ends.');
    st(at('(backward)'),'<code>printf</code> prints the backward heading.',s=>{put(s,'\nprinting values (backward) . . . . .\n');for(const k in s.nodes)s.nodes[k].cls='';});
    const lastId=size?ord[size-1]:null;
    st(at('ptr = last;'),'<code>ptr = last;</code> — ptr jumps straight to the last node. This is why we saved it in <code>last</code>.',s=>{s.tags.ptr=lastId;visit(s,lastId);s.hl=['ptr'];});
    for(let k=size-1;k>=0;k--){
      const id=ord[k],x=val(id),pv=k>0?ord[k-1]:null;
      st(at('while (ptr!=NULL)',2),'<code>ptr != NULL</code> → true. ptr is on node '+x+'.');
      st(at('printf("%d-> "',2),'<code>printf</code> prints '+x+'.',s=>{put(s,x+'-> ');s.nodes[id].cls='seen';});
      st(at('ptr = ptr -> prev;'),'<code>ptr = ptr -> prev;</code> — ptr moves backward'+(pv!==null?' to '+val(pv)+'.':' and becomes NULL.'),s=>{s.tags.ptr=pv;if(pv!==null)s.nodes[pv].cls='visit';s.hl=['ptr'];});
    }
    st(at('while (ptr!=NULL)',2),'<code>ptr != NULL</code> → false. The backward loop ends and the function returns.');
    break;}
  }
  return {fn:op,title:title,intro:'<span class="k2">Menu option '+opn+'</span>'+intro,steps:steps};
}

/* ---------- code panel ---------- */
codeBody.innerHTML=LINES.map((ln,i)=>'<div class="cl" data-l="'+(i+1)+'"><span class="ln">'+(i+1)+'</span><span class="tx">'+(highlight(ln)||' ')+'</span></div>').join('');
const codeLines=Array.prototype.slice.call(codeBody.querySelectorAll('.cl'));
codeTitle.textContent='Menu program — doubly linked list';
function scrollCodeTo(lineNo,center){
  const d=codeLines[lineNo-1];if(!d)return;
  const target=d.offsetTop-(center?codeBody.clientHeight/2-d.offsetHeight/2:12);
  if(codeBody.scrollHeight>codeBody.clientHeight+4)codeBody.scrollTo({top:Math.max(0,target),behavior:REDUCED?'auto':'smooth'});
}
function setFn(name){
  const r=fnRange(name);
  codeLines.forEach((d,i)=>d.classList.toggle('dim',i<r[0]||i>r[1]));
  codeTitle.textContent='Menu option '+MENU[name]+' → '+name+'()';
  scrollCodeTo(r[0]+1,false);
}
function markLines(line){
  const on=line==null?[]:(Array.isArray(line)?line:[line]);
  codeLines.forEach((d,i)=>d.classList.toggle('on',on.indexOf(i+1)>=0));
  if(on.length)scrollCodeTo(on[0],true);
}

/* ---------- UI ---------- */
function setSay(html,warn){
  sayEl.className='say'+(warn?' warn':'');
  sayEl.innerHTML=html;
}
function renderChips(){
  const v=id=>id==null?'NULL':(id==='?'?'?':(S.nodes[id]?S.nodes[id].val:'NULL'));
  let h='<span>head → <b>'+v(S.head)+'</b></span>';
  for(const k in S.tags)h+='<span>'+k+' → <b>'+v(S.tags[k])+'</b></span>';
  for(const k in S.vars)h+='<span>'+k+' = <b>'+S.vars[k]+'</b></span>';
  chipsEl.innerHTML=h;
  if(S.out!=null){termEl.hidden=false;termEl.innerHTML='<small>Console output</small>'+esc(S.out.replace(/^\n/,''));}
  else termEl.hidden=true;
}
function focusId(){
  const fl=S.order.find(i=>S.nodes[i].fl);
  if(fl!=null)return fl;
  const names=['temp','ptr','last','temp1'];
  for(let i=0;i<names.length;i++){const t=S.tags[names[i]];if(t!=null&&t!=='?'&&S.nodes[t])return t;}
  return S.head;
}
function show(){
  const n=cur.steps.length,i=cur.pos;
  if(!n){
    setSay('Pick a menu option above, then press "Next step".');
    markLines(null);countEl.textContent='';
  }else if(i<0){
    setSay(cur.intro+'<br><small>Now press "Next step" (or the → key).</small>');
    markLines(null);countEl.textContent='Step 0 / '+n;
  }else{
    const s=cur.steps[i];
    setSay('<span class="k2">Step '+(i+1)+'</span>'+s.msg+(i===n-1?'<br><span class="done">✓ Operation complete</span>':''));
    markLines(s.line);countEl.textContent='Step '+(i+1)+' / '+n;
  }
  btnBack.disabled=!(n&&i>=0);
  btnNext.disabled=!(n&&i<n-1);
  renderChips();
}
function applyNext(){
  if(cur.pos>=cur.steps.length-1)return false;
  const i=cur.pos+1;
  cur.hist[i]=clone(S);
  S.hl=[];
  cur.steps[i].fn(S);
  cur.pos=i;
  return true;
}
function next(){
  if(applyNext()){stage.set(S);stage.follow(focusId());show();}
  if(cur.pos>=cur.steps.length-1)stopAuto();
}
function back(){
  stopAuto();
  if(cur.pos<0)return;
  S=clone(cur.hist[cur.pos]);cur.pos--;
  stage.set(S);stage.follow(focusId());show();
}
function finishAll(){
  let moved=false;
  while(applyNext())moved=true;
  if(moved){stage.set(S,true);}
}
function stopAuto(){if(timer){clearInterval(timer);timer=null;}btnAuto.textContent='Auto play';}
function toggleAuto(){
  if(timer){stopAuto();return;}
  if(cur.pos>=cur.steps.length-1)return;
  btnAuto.textContent='Pause';
  timer=setInterval(next,+speedEl.value);
  next();
}
speedEl.addEventListener('input',()=>{if(timer){clearInterval(timer);timer=setInterval(next,+speedEl.value);}});

function startOp(op,btn){
  stopAuto();finishAll();
  const a={v:parseInt(el('valIn').value,10),p:parseInt(el('posIn').value,10)};
  const needV=['beginsert','endinsert','insertatanyplace'].indexOf(op)>=0;
  const needP=['insertatanyplace','deleteatanyplace'].indexOf(op)>=0;
  if(needV&&isNaN(a.v)){setSay('Enter a number in the "Value" box first.',true);return;}
  if(needP&&isNaN(a.p)){setSay('Enter a number in the "Position" box first (1 = first node).',true);return;}
  if(needV&&S.order.length>=MAXN){setSay('The screen fits at most '+MAXN+' nodes. Delete something first.',true);return;}
  S.tags={};S.vars={};S.hl=[];S.out=null;Object.keys(S.nodes).forEach(k=>{S.nodes[k].cls='';});
  const b=build(op,a);
  cur={steps:b.steps,pos:-1,hist:[],intro:b.intro,fn:op};
  setFn(op);
  document.querySelectorAll('button.op').forEach(x=>x.classList.toggle('on',x===btn));
  stage.set(S);show();stage.follow(focusId());
}
document.querySelectorAll('button.op').forEach(b=>b.addEventListener('click',()=>startOp(b.dataset.op,b)));
btnNext.addEventListener('click',next);
btnBack.addEventListener('click',back);
btnAuto.addEventListener('click',toggleAuto);

function setList(vals){
  stopAuto();
  S=mkState(vals);
  cur={steps:[],pos:-1,hist:[],intro:'',fn:cur.fn};
  document.querySelectorAll('button.op').forEach(x=>x.classList.remove('on'));
  codeLines.forEach(d=>d.classList.remove('dim','on'));
  codeTitle.textContent='Menu program — doubly linked list';
  stage.reset(S);show();
}
el('pr1').addEventListener('click',()=>setList([10,20,30]));
el('pr5').addEventListener('click',()=>setList([8,15,23,42,57]));
el('pr0').addEventListener('click',()=>setList([]));

document.addEventListener('keydown',e=>{
  const t=e.target&&e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA')return;
  if(e.key==='ArrowRight'&&cur.steps.length){next();}
  else if(e.key==='ArrowLeft'&&cur.steps.length){back();}
});

show();
})();
</script>
</body>
